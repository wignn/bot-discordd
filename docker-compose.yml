services:
  postgres:
    image: postgres:16-alpine
    container_name: forex-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=forex
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./wr-bot/init-db:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    networks:
      - forex-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d forex" ]
      interval: 10s
      timeout: 5s
      retries: 5

  news-server:
    build:
      context: ./news-server
      dockerfile: ../infrastructure/docker/Dockerfile.server
    container_name: news-server
    image: wign/news-server:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/forex
      - PORT=8000
      - API_KEYS=${API_KEYS:-}
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - forex-network

  discord-bot:
    build:
      context: ./wr-bot
      dockerfile: ../infrastructure/docker/Dockerfile.bot
    container_name: bot-discord
    image: wign/bot-discord:latest
    restart: unless-stopped
    volumes:
      - bot_data:/app/data
    environment:
      - RUST_LOG=info
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/forex
      - NEWS_WS_URL=ws://news-server:8000
      - FOREX_SERVICE_URL=http://news-server:8000
    env_file:
      - ./wr-bot/.env
    tty: true
    depends_on:
      postgres:
        condition: service_healthy
      news-server:
        condition: service_started
    networks:
      - forex-network

  # lavalink:
  #   image: ghcr.io/lavalink-devs/lavalink:4
