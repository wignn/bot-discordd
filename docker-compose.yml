  #   healthcheck:
  #     test: [ "CMD", "curl", "-sf", "-H", "Authorization: youshallnotpass", "http://localhost:2333/version" ]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3

  pgweb:
    image: sosedoff/pgweb:latest
    container_name: forex-pgweb
    restart: unless-stopped
    environment:
      - PGWEB_DATABASE_URL=postgres://postgres:postgres@postgres:5432/forex?sslmode=disable
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - forex-network
    profiles:
      - admin

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/Dockerfile.frontend
    container_name: forex-frontend
    image: wign/forex-frontend:latest
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    ports:
      - "3000:80"
    depends_on:
      - news-server
    networks:
      - forex-network

networks:
  forex-network:
    driver: bridge

volumes:
  postgres_data:
  bot_data:
