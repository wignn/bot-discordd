services:
  postgres:
    image: postgres:16-alpine
    container_name: forex-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=forex
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./wr-bot/init-db:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    networks:
      - forex-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d forex" ]
      interval: 10s
      timeout: 5s
      retries: 5


  rsshub:
    image: diygod/rsshub:latest
    container_name: rsshub
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "1200:1200"
    networks:
      - forex-network

  news-server:
    build:
      context: ./news-server
      dockerfile: ../infrastructure/docker/Dockerfile.server
    container_name: news-server
    image: wign/news-server:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./news-server/.env
    depends_on:
      postgres:
        condition: service_healthy
      rsshub:
        condition: service_started
    networks:
      - forex-network

  discord-bot:
    build:
      context: ./wr-bot
      dockerfile: ../infrastructure/docker/Dockerfile.bot
    container_name: bot-discord
    image: wign/bot-discord:latest
    restart: unless-stopped
    volumes:
      - bot_data:/app/data
    environment:
      - RUST_LOG=info
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/forex
      - NEWS_WS_URL=ws://news-server:8000
      - PRICE_WS_URL=ws://price:4000
      - FOREX_SERVICE_URL=http://news-server:8000
    env_file:
      - ./wr-bot/.env
    tty: true
    depends_on:
      postgres:
        condition: service_healthy
      news-server:
        condition: service_started
    networks:
      - forex-network


  pgweb:
    image: sosedoff/pgweb:latest
    container_name: forex-pgweb
    restart: unless-stopped
    environment:
      - PGWEB_DATABASE_URL=postgres://postgres:postgres@postgres:5432/forex?sslmode=disable
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - forex-network
    profiles:
      - admin

  price:
    build:
      context: ./price
    container_name: price-server
    image: wign/price-server:latest
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - SYMBOLS=FX:XAUUSD,FX:EURUSD,FX:GBPUSD,FX:USDJPY,BINANCE:BTCUSDT,BINANCE:ETHUSDT,BINANCE:SOLUSDT,BINANCE:BNBUSDT
      - LOG_LEVEL=info
    networks:
      - forex-network

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/Dockerfile.frontend
      args:
        VITE_API_URL: https://api.wign.cloud
        VITE_WS_URL: wss://api.wign.cloud
        VITE_PRICE_WS_URL: wss://price.wign.cloud
    container_name: forex-frontend
    image: wign/forex-frontend:latest
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    ports:
      - "3000:80"
    depends_on:
      - news-server
    networks:
      - forex-network

networks:
  forex-network:
    driver: bridge

volumes:
  postgres_data:
  bot_data:
