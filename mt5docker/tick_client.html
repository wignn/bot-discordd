<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MT5 Live Tick</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #0a0a1a; color: #e0e0e0; padding: 20px; }
    h1 { color: #00d4ff; margin-bottom: 20px; }
    .controls { display: flex; gap: 10px; margin-bottom: 20px; align-items: center; }
    input, button { padding: 10px 16px; border-radius: 6px; border: 1px solid #333; font-size: 14px; }
    input { background: #1a1a2e; color: #fff; width: 200px; }
    button { background: #00d4ff; color: #000; font-weight: bold; cursor: pointer; border: none; }
    button:hover { background: #00b8d4; }
    button.stop { background: #ff4444; color: #fff; }
    .status { padding: 6px 12px; border-radius: 12px; font-size: 12px; font-weight: bold; }
    .status.connected { background: #00c853; color: #000; }
    .status.disconnected { background: #ff4444; color: #fff; }
    .price-card {
      background: #1a1a2e; border: 1px solid #333; border-radius: 12px;
      padding: 24px; max-width: 500px; margin-bottom: 20px;
    }
    .symbol-name { font-size: 28px; font-weight: bold; color: #00d4ff; }
    .price-row { display: flex; justify-content: space-between; margin-top: 16px; }
    .price-box { text-align: center; flex: 1; }
    .price-label { font-size: 12px; color: #888; text-transform: uppercase; }
    .price-value { font-size: 32px; font-weight: bold; font-family: 'Courier New', monospace; margin-top: 4px; }
    .bid { color: #ff5252; }
    .ask { color: #69f0ae; }
    .meta { display: flex; gap: 20px; margin-top: 16px; font-size: 13px; color: #888; }
    .tick-log { max-height: 300px; overflow-y: auto; background: #111; border-radius: 8px; padding: 12px; font-family: monospace; font-size: 12px; }
    .tick-log div { padding: 2px 0; border-bottom: 1px solid #1a1a2e; }
    .tick-log .up { color: #69f0ae; }
    .tick-log .down { color: #ff5252; }
    .tick-log .same { color: #888; }
  </style>
</head>
<body>
  <h1>MT5 Live Tick Stream</h1>

  <div class="controls">
    <input id="symbolInput" type="text" placeholder="Symbol (e.g. XAUUSDm)" value="XAUUSDm" />
    <button id="connectBtn" onclick="startStream()">Connect</button>
    <button class="stop" onclick="stopStream()">Stop</button>
    <span id="statusBadge" class="status disconnected">Disconnected</span>
  </div>

  <div class="price-card" id="priceCard" style="display:none;">
    <div class="symbol-name" id="symbolName"></div>
    <div class="price-row">
      <div class="price-box">
        <div class="price-label">Bid</div>
        <div class="price-value bid" id="bidPrice">-</div>
      </div>
      <div class="price-box">
        <div class="price-label">Ask</div>
        <div class="price-value ask" id="askPrice">-</div>
      </div>
    </div>
    <div class="meta">
      <span>Spread: <strong id="spreadVal">-</strong></span>
      <span>Volume: <strong id="volumeVal">-</strong></span>
      <span>Time: <strong id="timeVal">-</strong></span>
      <span>Ticks: <strong id="tickCount">0</strong></span>
    </div>
  </div>

  <h3 style="margin-bottom:8px; color:#888;">Tick Log</h3>
  <div class="tick-log" id="tickLog"></div>

  <script>
    let ws = null;
    let ticks = 0;
    let lastBid = 0;

    function setStatus(connected) {
      const badge = document.getElementById('statusBadge');
      badge.textContent = connected ? 'Connected' : 'Disconnected';
      badge.className = 'status ' + (connected ? 'connected' : 'disconnected');
    }

    function startStream() {
      stopStream();
      const symbol = document.getElementById('symbolInput').value.trim();
      if (!symbol) return alert('Enter symbol name');

      const wsUrl = 'ws://' + (location.hostname || 'localhost') + ':8765';
      ws = new WebSocket(wsUrl);

      ws.onopen = function() {
        setStatus(true);
        ticks = 0;
        document.getElementById('tickLog').innerHTML = '';
        document.getElementById('priceCard').style.display = 'block';
        document.getElementById('symbolName').textContent = symbol;
        ws.send(JSON.stringify({ symbol: symbol }));
      };

      ws.onmessage = function(event) {
        var data = JSON.parse(event.data);
        if (data.error) {
          addLog('ERROR: ' + data.error, 'down');
          return;
        }

        ticks++;
        document.getElementById('bidPrice').textContent = data.bid.toFixed(3);
        document.getElementById('askPrice').textContent = data.ask.toFixed(3);
        document.getElementById('spreadVal').textContent = data.spread.toFixed(2);
        document.getElementById('volumeVal').textContent = data.volume;
        document.getElementById('tickCount').textContent = ticks;

        var dt = new Date(data.time * 1000);
        document.getElementById('timeVal').textContent = dt.toLocaleTimeString();

        var dir = data.bid > lastBid ? 'up' : data.bid < lastBid ? 'down' : 'same';
        addLog(
          dt.toLocaleTimeString() + ' | Bid: ' + data.bid.toFixed(3) +
          ' | Ask: ' + data.ask.toFixed(3) + ' | Spread: ' + data.spread.toFixed(2),
          dir
        );
        lastBid = data.bid;
      };

      ws.onclose = function() { setStatus(false); };
      ws.onerror = function() { setStatus(false); };
    }

    function stopStream() {
      if (ws) { ws.close(); ws = null; }
      setStatus(false);
    }

    function addLog(text, cls) {
      var log = document.getElementById('tickLog');
      var div = document.createElement('div');
      div.className = cls;
      div.textContent = text;
      log.prepend(div);
      while (log.children.length > 200) log.removeChild(log.lastChild);
    }
  </script>
</body>
</html>
